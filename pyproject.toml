[project]
name = "ai-dev-team"
version = "0.1.0"
description = "AI Dev Team —— 本地 AI 软件开发团队协作平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "alembic>=1.20.0",
    "httpx>=0.28.1",
    # pytest 是**运行时**依赖，不是开发依赖：L3 工具 run_pytest 用
    # sys.executable -m pytest 执行模型写的测试代码。放在 dev 组时镜像
    # （uv sync --no-dev）里没有它，测试执行只会报 "No module named pytest"，
    # Tester 如实判 fail、Reviewer 如实打回 —— 模型改代码永远修不好，
    # 返工循环走不出去（2026-09-23 容器内实测）。
    "pytest>=8.3.0",
]

[project.optional-dependencies]
mysql = [
    "aiomysql>=0.3.2",
    "cryptography>=50.0.1",
]
redis = [
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
# 自动生成的迁移脚本不按手写代码的标准 lint：里面的单引号、长行都是
# alembic autogenerate 的产物，改了下次生成还会覆盖回来，纯属制造无意义的 diff。
# （migrations/env.py 是手写的，照常检查）
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
