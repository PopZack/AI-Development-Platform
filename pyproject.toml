[project]
name = "ai-dev-team"
version = "0.1.0"
description = "AI Dev Team —— 本地 AI 软件开发团队协作平台"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",
    "argon2-cffi>=23.1.0",
    "pyjwt>=2.9.0",
    "alembic>=1.20.0",
]

[project.optional-dependencies]
mysql = [
    "aiomysql>=0.3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
# 自动生成的迁移脚本不按手写代码的标准 lint：里面的单引号、长行都是
# alembic autogenerate 的产物，改了下次生成还会覆盖回来，纯属制造无意义的 diff。
# （migrations/env.py 是手写的，照常检查）
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
