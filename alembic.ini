# Alembic configuration (Stage 5: deployments need versioned schema changes).
#
# NOTE: this file is kept ASCII-only on purpose. Alembic reads alembic.ini with
# the *locale* encoding, so on a Windows machine with a GBK locale any non-ASCII
# comment here makes every alembic command fail with UnicodeDecodeError.
# The Chinese rationale for these settings lives in migrations/env.py instead
# (Python files are always read as UTF-8).
#
# NOTE: sqlalchemy.url is intentionally NOT set here. Migrations and the app
# must point at the same database; configuring the URL twice guarantees drift
# (migrate database A, run against database B). migrations/env.py reads it from
# app.config.settings, the same source the runtime uses.

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
